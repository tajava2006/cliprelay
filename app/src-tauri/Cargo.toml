[package]
name = "cliprelay"
version = "0.0.2"
description = "ClipRelay — cross-device clipboard sync via Nostr"
authors = ["hoppe"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cliprelay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.5.7"
tauri-plugin-notification = "2.3.3"
tauri-plugin-amber = { path = "plugins/tauri-plugin-amber" }
tauri-plugin-foreground-service = { path = "plugins/tauri-plugin-foreground-service" }
tauri-plugin-clipboard-action = { path = "plugins/tauri-plugin-clipboard-action" }
tauri-plugin-keychain = { path = "plugins/tauri-plugin-keychain" }

# Desktop 전용: 자동 업데이트 (Android는 zapstore로 배포)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# macOS 전용: NSPasteboard 직접 접근 (concealed 마커 감지/전파 — clipboard-manager
# 플러그인은 텍스트/이미지만 다루고 pasteboard 타입 목록을 노출하지 않는다)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

# Windows/Linux: concealed 마커 쓰기 — arboard가 양쪽 규약을 내장
# (Windows ExcludeClipboardContentFromMonitorProcessing, KDE x-kde-passwordManagerHint)
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
arboard = "3"

# Windows: concealed 마커 감지 (클립보드 포맷 존재 확인)
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_DataExchange"] }

